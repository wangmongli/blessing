<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7b2d8e">
<title>祝福小游戏 · 送TA一条专属祝福 ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #2b1055 0%, #6a2c8f 30%, #c94b7b 62%, #ffb26b 100%);
    background-attachment: fixed;
    color: #fff; user-select: none; touch-action: manipulation;
    position: relative; overflow: hidden;
  }

  /* 飘浮光点 */
  .bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .orb {
    position: absolute; border-radius: 50%; background: #fff; opacity: .5;
    animation: floatOrb linear infinite;
  }
  @keyframes floatOrb {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    10%  { opacity: .6; }
    90%  { opacity: .5; }
    100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
  }

  /* 头部 */
  .header { position: relative; z-index: 5; text-align: center; padding: calc(26px + env(safe-area-inset-top)) 20px 0; }
  .header h1 {
    font-size: clamp(24px, 6.6vw, 40px); letter-spacing: 2px;
    background: linear-gradient(90deg, #ffe9b0, #fff, #ffe9b0);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 14px rgba(255,190,120,.4));
  }
  .header p { margin-top: 8px; font-size: clamp(13px, 3.8vw, 16px); color: rgba(255,255,255,.82); }

  /* 主舞台 */
  .stage {
    position: absolute; left: 0; right: 0; top: calc(50% - 20px);
    transform: translateY(-50%); z-index: 5;
    display: flex; flex-direction: column; align-items: center; padding: 0 24px;
    transition: opacity .35s ease, transform .35s ease;
  }
  .stage.fade { opacity: 0; transform: translateY(-58%) scale(.94); pointer-events: none; }

  .gift {
    font-size: clamp(84px, 24vw, 140px); line-height: 1; cursor: pointer;
    filter: drop-shadow(0 16px 34px rgba(0,0,0,.45));
    animation: bob 2.6s ease-in-out infinite;
    transition: transform .15s ease;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  .gift.shake { animation: shakeGift .45s ease-in-out; }
  @keyframes shakeGift {
    0%,100% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-12deg) scale(1.06); }
    40% { transform: rotate(11deg) scale(1.08); }
    60% { transform: rotate(-8deg) scale(1.05); }
    80% { transform: rotate(6deg) scale(1.03); }
  }

  .hint { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,.72); letter-spacing: 1px; }

  .name-input {
    margin-top: 22px; width: min(320px, 82vw);
    background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.4);
    border-radius: 999px; padding: 13px 20px; color: #fff; font-size: 16px; text-align: center;
    outline: none; backdrop-filter: blur(8px); transition: border-color .2s ease, background .2s ease;
  }
  .name-input::placeholder { color: rgba(255,255,255,.55); }
  .name-input:focus { border-color: #ffe9b0; background: rgba(255,255,255,.2); }

  .draw-btn {
    margin-top: 18px; cursor: pointer; border: none;
    background: linear-gradient(135deg, #ffd166, #ff9a3c 55%, #ff6b6b);
    color: #5b1d2b; font-size: clamp(17px, 4.8vw, 21px); font-weight: 900; letter-spacing: 4px;
    padding: 16px 54px; border-radius: 999px;
    box-shadow: 0 12px 32px rgba(255,120,90,.45), inset 0 -3px 0 rgba(0,0,0,.15);
    transition: transform .13s ease, box-shadow .2s ease;
  }
  .draw-btn:active { transform: scale(.94); box-shadow: 0 6px 16px rgba(255,120,90,.4); }

  /* 祝福卡片 */
  .card-wrap {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .card-wrap.show { opacity: 1; pointer-events: auto; }

  .card {
    width: min(360px, 88vw);
    background: linear-gradient(165deg, #fffdf7 0%, #fff4e0 55%, #ffe6c7 100%);
    border-radius: 24px; padding: 30px 26px 24px;
    color: #5b3a2e; text-align: center;
    box-shadow: 0 26px 70px rgba(0,0,0,.5), 0 0 0 6px rgba(255,255,255,.25);
    transform: scale(.55) rotate(-9deg); opacity: 0;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
    position: relative; overflow: hidden;
  }
  .card-wrap.show .card { transform: scale(1) rotate(0); opacity: 1; }
  .card::before {
    content: ""; position: absolute; top: -60px; right: -60px; width: 160px; height: 160px;
    border-radius: 50%; background: rgba(255,193,120,.28);
  }
  .card::after {
    content: ""; position: absolute; bottom: -70px; left: -50px; width: 150px; height: 150px;
    border-radius: 50%; background: rgba(201,75,123,.14);
  }
  .card .to {
    font-size: 14px; color: #b07b5c; letter-spacing: 2px; position: relative; z-index: 1;
  }
  .card .to b { color: #c94b7b; font-size: 16px; }
  .card .bless {
    margin: 18px 0 8px; font-size: clamp(19px, 5.4vw, 25px); font-weight: 800;
    line-height: 1.65; color: #4a2c22; position: relative; z-index: 1;
    min-height: 2em;
  }
  .card .divider {
    width: 64px; height: 2px; margin: 16px auto;
    background: linear-gradient(90deg, transparent, #e0a878, transparent); position: relative; z-index: 1;
  }
  .card .from { font-size: 13px; color: #a9856b; letter-spacing: 1px; position: relative; z-index: 1; }

  .card-actions { display: flex; gap: 12px; margin-top: 20px; position: relative; z-index: 1; }
  .c-btn {
    flex: 1; cursor: pointer; border: none; border-radius: 999px; padding: 13px 10px;
    font-size: 15px; font-weight: 800; letter-spacing: 1px;
    transition: transform .12s ease, filter .2s ease;
  }
  .c-btn:active { transform: scale(.95); }
  .c-btn.primary { background: linear-gradient(135deg, #ff9a3c, #ff6b6b); color: #fff; box-shadow: 0 8px 20px rgba(255,107,107,.35); }
  .c-btn.ghost { background: rgba(91,58,46,.08); color: #7a5140; }

  /* 提示 toast */
  .toast {
    position: absolute; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px); z-index: 20;
    background: rgba(0,0,0,.72); color: #fff; padding: 11px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <header class="header">
    <h1>祝福小游戏 ✨</h1>
    <p>点开礼盒，为 TA 抽一条专属祝福</p>
  </header>

  <div class="stage" id="stage">
    <div class="gift" id="gift">🎁</div>
    <div class="hint">点一下礼盒</div>
    <input class="name-input" id="nameInput" type="text" maxlength="12" placeholder="输入好友名字（可不填）">
    <button class="draw-btn" id="drawBtn">抽 祝 福</button>
  </div>

  <div class="card-wrap" id="cardWrap">
    <div class="card">
      <div class="to">给 <b id="toName">你</b> 的祝福</div>
      <div class="bless" id="blessMsg">愿你被这个世界温柔以待</div>
      <div class="divider"></div>
      <div class="from">—— 真心祝福你</div>
      <div class="card-actions">
        <button class="c-btn ghost" id="againBtn">再抽一次</button>
        <button class="c-btn primary" id="copyBtn">复制祝福</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已复制，去粘贴给 TA 吧</div>

<script>
(function () {
  var BLESSINGS = [
    "愿你所求皆如愿，所行皆坦途",
    "愿你被这个世界温柔以待",
    "愿你前程似锦，未来可期",
    "愿你三冬暖，春不寒",
    "愿你天黑有灯，下雨有伞",
    "愿你脸上永远有笑容",
    "愿你做自己喜欢的事，爱自己喜欢的人",
    "愿你岁岁平安，年年有余",
    "愿你所有努力都不被辜负",
    "愿你眼里长着太阳，笑里全是坦荡",
    "愿你每一天都闪闪发光",
    "愿你身边的人都善良",
    "愿你想要的都拥有，得不到的都释怀",
    "愿你此后人生，一路繁花",
    "愿你平安喜乐，万事胜意",
    "愿你被爱，被珍惜，被温柔以待",
    "愿你所到之处，皆是阳光",
    "愿你一生清澈明朗",
    "愿你的世界永远晴朗",
    "愿你被生活温柔以待",
    "愿你从此顺风顺水，无忧无虑",
    "愿你心想事成，好梦成真",
    "愿你成为自己的太阳，无需凭借谁的光",
    "愿你温柔且有力量，善良且有锋芒",
    "愿你所遇皆良人，所行皆坦途",
    "愿你笑口常开，好运自来",
    "愿你健康平安，长长久久",
    "愿你眼里有星辰，心中有山海",
    "愿你被偏爱，被例外，被珍惜",
    "愿你的努力都有回报，你的期待都有结果",
    "愿你此生尽兴，赤诚善良",
    "愿你所有的愿望都能实现",
    "愿你每天都元气满满，活力无限",
    "愿你如阳光般温暖，如星光般闪耀",
    "愿你遇到的人都是好人，做的事都是好事",
    "愿你的生活甜甜的，心情美美的",
    "愿你从此没有烦恼，只有快乐",
    "愿你被岁月温柔相待，被时光深情相拥",
    "愿你所盼皆如愿，所念皆星河",
    "愿你此生的每个明天，都比今天更好",
    "愿你出走半生，归来仍是少年",
    "愿你所有热爱都不留遗憾",
    "愿你被世界偏爱，被生活善待",
    "愿你星光满载，前程灿烂",
    "愿你所行化坦途，所求皆如愿",
    "愿你一年更比一年好",
    "愿你生活明朗，万物可爱",
    "愿你此后的路，步步生花",
    "愿你心有暖阳，无惧风霜",
    "愿你一生努力，一生被爱",
    "愿你好运常伴，笑颜常在",
    "愿你所愿皆成真，所行皆坦荡",
    "愿你眼里是阳光，笑里是坦荡",
    "愿你时光不负，岁月可期",
    "愿你被生活宠爱，被岁月温柔",
    "愿你往后余生，步步皆坦途",
    "愿你每天都有小确幸",
    "愿你所念之人，平安喜乐",
    "愿你所有的坚持，都有回响",
    "愿你被世界温柔拥抱",
    "愿你未来可期，人间值得",
    "愿你不负韶华，不负自己",
    "愿你岁岁常欢愉，年年皆胜意",
    "愿你如春风般温暖，如夏花般绚烂",
    "愿你心中有爱，眼里有光",
    "愿你所求皆有应，所行皆有果",
    "愿你被幸福环绕，被快乐包围",
    "愿你的梦想都能开花结果",
    "愿你此后无忧无虑，自由自在",
    "愿你所有的美好，都如期而至",
    "愿你被这人间好好珍惜",
    "愿你一生顺遂，平安喜乐",
    "愿你心中有丘壑，眉目作山河",
    "愿你所行之路，皆有繁花相送",
    "愿你笑容常在，快乐常伴",
    "愿你平安顺遂，喜乐无忧",
    "愿你被时光善待，被岁月温柔",
    "愿你所想皆如愿，所行皆坦途",
    "愿你此后人生，皆是晴天",
    "愿你心中有梦，眼里有光，脚下有路",
    "愿你此生无忧，笑口常开",
    "愿你所遇皆是温柔，所行皆是坦途",
    "愿你被时光偏爱，被岁月温柔",
    "愿你一生热烈，一生自由",
    "愿你所有的等待，都不被辜负",
    "愿你往后余生，皆是欢喜",
    "愿你梦想成真，未来可期",
    "愿你心想事成，万事顺遂",
    "愿你不念过往，不畏将来",
    "愿你眼中总有光芒，活成你想要的模样",
    "愿你被爱包围，被幸福环绕",
    "愿你此后的日子，温柔又闪光",
    "愿你岁月无波澜，余生不悲欢",
    "愿你所到之处，遍地阳光",
    "愿你被偏爱到老，被宠成宝",
    "愿你的世界，永远明媚如春",
    "愿你今晚有个好梦，明天有好运",
    "愿你的每一次努力，都被世界看见",
    "愿你一直在成为自己"
  ];

  var stage = document.getElementById('stage');
  var gift = document.getElementById('gift');
  var nameInput = document.getElementById('nameInput');
  var cardWrap = document.getElementById('cardWrap');
  var toName = document.getElementById('toName');
  var blessMsg = document.getElementById('blessMsg');
  var toast = document.getElementById('toast');

  var drawing = false;
  var currentText = '';
  var lastIndex = -1;

  // 背景光点
  (function initOrbs() {
    var bg = document.getElementById('bg');
    for (var i = 0; i < 26; i++) {
      var o = document.createElement('div');
      o.className = 'orb';
      var sz = Math.random() * 5 + 2;
      o.style.width = sz + 'px';
      o.style.height = sz + 'px';
      o.style.left = Math.random() * 100 + '%';
      o.style.bottom = (-10 - Math.random() * 30) + '%';
      var dur = 9 + Math.random() * 13;
      o.style.animationDuration = dur + 's';
      o.style.animationDelay = (-Math.random() * dur) + 's';
      bg.appendChild(o);
    }
  })();

  function pickBlessing() {
    var idx = Math.floor(Math.random() * BLESSINGS.length);
    if (idx === lastIndex) idx = (idx + 1) % BLESSINGS.length;
    lastIndex = idx;
    return BLESSINGS[idx];
  }

  function getTarget() {
    var n = (nameInput.value || '').trim();
    return n ? n : '你';
  }

  function draw() {
    if (drawing) return;
    drawing = true;

    gift.classList.add('shake');
    setTimeout(function () {
      gift.classList.remove('shake');
      var name = getTarget();
      var text = pickBlessing();
      currentText = '给' + name + '的祝福：' + text + ' ✨';

      toName.textContent = name;
      blessMsg.textContent = text;
      cardWrap.classList.add('show');
      stage.classList.add('fade');
      if (navigator.vibrate) { try { navigator.vibrate(22); } catch (e) {} }
      drawing = false;
    }, 460);
  }

  function closeCard() {
    cardWrap.classList.remove('show');
    stage.classList.remove('fade');
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function copyBlessing() {
    var name = getTarget();
    var text = '给' + name + '的祝福：' + blessMsg.textContent + ' ✨';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('已复制！去粘贴给 TA 吧');
      }).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制！去粘贴给 TA 吧');
    } catch (e) {
      showToast('复制失败，请手动长按选择');
    }
  }

  gift.addEventListener('click', draw);
  document.getElementById('drawBtn').addEventListener('click', draw);
  document.getElementById('againBtn').addEventListener('click', function () {
    closeCard();
    setTimeout(draw, 260);
  });
  document.getElementById('copyBtn').addEventListener('click', copyBlessing);

  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); draw(); }
  });

  window.addEventListener('resize', function () {});
})();
</script>
</body>
</html>
